syntax = "proto3";

import "worker/v1/worker.proto";

// EasyLab core + gateway API: the revision-native lab, ops and package
// surfaces. Replaces the hand-written /api/v1/routes. This is the contract the
// Flutter client and the ext servers consume.
package easylab.v1;

option go_package = "github.com/easylab-platform/easylab-proto/easylab/v1;easylabv1";

// ---------- shared ----------

message RepoRefReq {
  string org = 1;
  string repo = 2;
}

message RepoInfo {
  string namespace = 1;
  string name = 2;
  string default_branch = 3;
  string sha = 4;
  map<string, string> meta = 5;
}

message Ok {
  bool ok = 1;
  string error = 2;
}

message FileEntry {
  string name = 1;
  string path = 2;
  string kind = 3; // file | dir | symlink | ...
  int32 size = 4;
}

message DiffFile {
  string path = 1;
  string diff = 2;
  int32 additions = 3;
  int32 deletions = 4;
}

message CommitInfo {
  string change_id = 1;
  string commit_id = 2;
  string author = 3;
  string timestamp = 4;
  string message = 5;
}

message TagInfo {
  string name = 1;
  string target = 2;
}

message BranchInfo {
  string name = 1;
  string sha = 2;
}

message RevisionInfo {
  string rev = 1;
  string sha = 2;
  string message = 3;
  string author = 4;
  string timestamp = 5;
}

message RevisionFile {
  string path = 1;
  string mode = 2;
  string sha = 3;
}

message MirrorInfo {
  string name = 1;
  string url = 2;
  string status = 3;
}

// ---------- repos ----------

message ListReposRequest {}
message ListReposResponse { repeated RepoInfo repos = 1; }

message CreateRepoRequest { string org = 1; string repo = 2; }
message CreateRepoResponse { bool ok = 1; string error = 2; }

message DeleteRepoRequest { string org = 1; string repo = 2; }
message DeleteRepoResponse { bool ok = 1; string deleted = 2; }

message EnsureRepoRequest { string org = 1; string repo = 2; }
message EnsureRepoResponse { bool ok = 1; string error = 2; }

message EnsureOrgRequest { string org = 1; }
message EnsureOrgResponse { bool ok = 1; string error = 2; }

message ForkRepoRequest { string org = 1; string repo = 2; string to = 3; }
message ForkRepoResponse { bool ok = 1; string error = 2; }
message CloneRepoRequest {
  string org = 1;
  string repo = 2;
  string git_url = 3;
  string rev = 4;
}
message CloneRepoResponse { bool ok = 1; string error = 2; }

message TreeRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message TreeResponse { repeated FileEntry entries = 1; }

message ReadBlobRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message ReadBlobResponse { string content = 1; bytes raw = 2; }

message WriteBlobRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
  string content = 5;
  bytes raw = 6;
  string message = 7;
}
message WriteBlobResponse { bool ok = 1; string error = 2; }

message LogRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  int32 limit = 4;
}
message LogResponse { repeated CommitInfo commits = 1; }

message TagsRequest { string org = 1; string repo = 2; }
message TagsResponse { repeated TagInfo tags = 1; }

message BranchesRequest { string org = 1; string repo = 2; }
message BranchesResponse { repeated BranchInfo branches = 1; }

message RevisionsRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  int32 limit = 4;
}
message RevisionsResponse { repeated RevisionInfo revisions = 1; }

message DiffRequest {
  string org = 1;
  string repo = 2;
  string change_id = 3;
  string path = 4;
  string from = 5;
  string to = 6;
}
message DiffResponse { repeated DiffFile files = 1; }

message BlameRequest {
  string org = 1;
  string repo = 2;
  string path = 3;
  string ref = 4;
}
message BlameResponse { repeated string lines = 1; }

message DeleteBranchRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
}
message DeleteBranchResponse { bool ok = 1; string error = 2; }

message CreateBranchRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
  string from = 4;
}
message CreateBranchResponse { bool ok = 1; string error = 2; }

message FileHistoryRequest {
  string org = 1;
  string repo = 2;
  string path = 3;
  string ref = 4;
}
message FileHistoryResponse { repeated CommitInfo commits = 1; }

// ---------- ops ----------

enum ServiceKind {
  SERVICE_KIND_UNSPECIFIED = 0;
  SERVICE_KIND_DEPLOYMENT = 1;
  SERVICE_KIND_BARE = 2;
}

message ServiceInfo {
  string name = 1;
  string image = 2;
  int32 replicas = 3;
  int32 ready = 4;
  string namespace = 5;
  string age = 6;
  repeated int32 ports = 7;
  string session = 8;
  string status = 9;
  string url = 10;
  string kind = 11;
  string pod_ip = 12;  // direct pod address (sandbox worker reach)
  string phase = 13;   // running | pending | ...
}

message ServicePod {
  string name = 1;
  string ip = 2;
  string phase = 3;
  bool ready = 4;
  string image = 5;
  string age = 6;
  int32 restarts = 7;
}

message ListServicesRequest {
  bool all = 1;
  string org = 2;
  string repo = 3;
  string namespace = 4;
}
message ListServicesResponse { repeated ServiceInfo services = 1; }

message GetServiceRequest { string name = 1; }
message GetServiceResponse { ServiceInfo service = 1; repeated ServicePod pods = 2; }

// PortSpec maps a container port to a published service port.
message PortSpec {
  int32 container = 1;
  int32 service = 2;
}

message LaunchServiceRequest {
  string name = 1;
  string image = 2;
  string kind = 3; // "bare" (sandbox/worker pod) | "deployment"
  string command = 4;
  repeated PortSpec ports = 5;
  map<string, string> env = 6;
  int32 replicas = 7;
  string group = 8;
  string network = 9;
  string namespace = 10;
  string cpus = 11;
  uint64 memory_bytes = 12;
  map<string, string> annotations = 13;
  string session = 14;
  string org = 15;
  string repo = 16;
}
message LaunchServiceResponse { bool ok = 1; string error = 2; string name = 3; string url = 4; }

message DeleteServiceRequest { string name = 1; }
message DeleteServiceResponse { bool ok = 1; string error = 2; }

message ScaleServiceRequest {
  string name = 1;
  int32 replicas = 2;
}
message ScaleServiceResponse { bool ok = 1; string error = 2; }

message SandboxExecRequest {
  string name = 1;
  string command = 2;
  string workdir = 3;
  string stdin = 4;
}
message SandboxExecResponse {
  int32 exit_code = 1;
  string output = 2;
  string job_id = 3;
  bool backgrounded = 4;
  string note = 5;
  string error = 6;
}

message SandboxReadRequest { string name = 1; string path = 2; }
message SandboxReadResponse { string content = 1; string error = 2; }

message SandboxWriteRequest {
  string name = 1;
  string path = 2;
  string content = 3;
}
message SandboxWriteResponse { bool ok = 1; string error = 2; }

message SandboxJobKillRequest { string name = 1; string job_id = 2; }
message SandboxJobKillResponse { bool ok = 1; string error = 2; }

message TaskLogRequest { string id = 1; }

message ListTasksRequest {}
message TaskEntry {
  string id = 1;
  string kind = 2;
  string state = 3;
  string session = 4;
  string command = 5;
  string created_at = 6;
}
message ListTasksResponse { repeated TaskEntry tasks = 1; }

message GetTaskRequest { string id = 1; }
message GetTaskResponse { TaskEntry task = 1; }

message BuildRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string dockerfile_path = 4;
  string tag = 5;
  string context = 6;
  bool no_cache = 7;
}
message BuildResponse {
  bool ok = 1;
  string task_id = 2;
  string image = 3;
  string error = 4;
}

message OpsStatusRequest {}
message OpsStatusResponse {
  bool ok = 1;
  string version = 2;
  int32 sandboxes = 3;
}

message ListNamespacesRequest {}
message NamespaceInfo { string name = 1; }
message ListNamespacesResponse { repeated NamespaceInfo namespaces = 1; }

// ---------- registry / packages ----------

message PackageTypeEntry {
  string type = 1;
  string upstream = 2;
  int32 packages = 3;
}

message ListPackageTypesRequest {}
message ListPackageTypesResponse { repeated PackageTypeEntry packages = 1; }

message PackageVersion {
  string version = 1;
  int32 download_count = 2;
  int64 created_unix = 3;
  repeated PackageVersionFile files = 4;
}

message PackageVersionFile {
  string id = 1;
  string name = 2;
  int64 size = 3;
  string sha = 4;
}

message PackageInfo {
  string type = 1;
  string name = 2;
  repeated PackageVersion versions = 3;
}

message ListPackagesRequest {
  string type = 1;
  string q = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 limit = 5;
  int32 offset = 6;
}
message ListPackagesResponse { repeated PackageInfo packages = 1; }

message PackageVersionsRequest { string type = 1; string name = 2; }
message PackageVersionsResponse { repeated PackageVersion versions = 1; }

message DeletePackageRequest { string type = 1; string name = 2; }
message DeletePackageResponse { bool ok = 1; string error = 2; }

message DeletePackageVersionRequest {
  string type = 1;
  string name = 2;
  string version = 3;
}
message DeletePackageVersionResponse { bool ok = 1; string error = 2; }

message PublishSpec {
  string protocol = 1;
  repeated string args = 2;
  repeated string required = 3;
}

message ListPublishSpecsRequest {}
message ListPublishSpecsResponse { repeated PublishSpec specs = 1; }

// ---------- misc ----------

message HealthRequest {}
message HealthResponse { bool ok = 1; string version = 2; }

message StatusRequest {}
message StatusResponse {
  bool ok = 1;
  string version = 2;
  string db = 3;
  int32 sandboxes = 4;
}

// ---------- search / graph / compare / rebase ----------

message SearchRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string q = 4;
}
message SearchResponse { repeated string matches = 1; } // matching paths

message GraphRequest {
  string org = 1;
  string repo = 2;
  int32 limit = 3;
}
message GraphNode {
  string revision_id = 1;
  string snapshot = 2;
  string message = 3;
  string author = 4;
  repeated string parents = 5;
  bool is_head = 6;
  int64 created_ms = 7;
}
message GraphResponse { repeated GraphNode nodes = 1; }

message CompareRequest {
  string org = 1;
  string repo = 2;
  string from = 3;
  string to = 4;
}
message CompareResponse { repeated DiffFile files = 1; }

message RebaseRequest {
  string org = 1;
  string repo = 2;
  string rev = 3;
  repeated string new_parents = 4;
}
message RebaseResponse {
  string revision_id = 1;
  string snapshot = 2;
}

// ---------- sync (repo snapshot into a service container) ----------

message SyncRequest {
  string name = 1;       // service/container name
  string org = 2;
  string repo = 3;
  string rev = 4;
  string namespace = 5;
  string dest = 6;       // extract destination inside the container (default /workspace)
  bool force = 7;
}
message SyncResponse {
  bool ok = 1;
  int32 files = 2;
}

// ---------- service ----------

// LabService covers the revision-native repo + filesystem surface.
service LabService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc EnsureRepo(EnsureRepoRequest) returns (EnsureRepoResponse);
  rpc EnsureOrg(EnsureOrgRequest) returns (EnsureOrgResponse);
  rpc ForkRepo(ForkRepoRequest) returns (ForkRepoResponse);
  rpc CloneRepo(CloneRepoRequest) returns (CloneRepoResponse);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc ReadBlob(ReadBlobRequest) returns (ReadBlobResponse);
  rpc WriteBlob(WriteBlobRequest) returns (WriteBlobResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc Tags(TagsRequest) returns (TagsResponse);
  rpc Branches(BranchesRequest) returns (BranchesResponse);
  rpc Revisions(RevisionsRequest) returns (RevisionsResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc Blame(BlameRequest) returns (BlameResponse);
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc FileHistory(FileHistoryRequest) returns (FileHistoryResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Graph(GraphRequest) returns (GraphResponse);
  rpc Compare(CompareRequest) returns (CompareResponse);
  rpc Rebase(RebaseRequest) returns (RebaseResponse);

  // ---- Lab additions (REST removals) ----
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  // Releases (backed by the generic artifact registry; format "generic").
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc DownloadReleaseAsset(DownloadReleaseAssetRequest) returns (DownloadReleaseAssetResponse);
  // Source archive tarball for a rev/tag.
  rpc Archive(ArchiveRequest) returns (ArchiveResponse);
  // Mirror (persistent push/pull mirrors on a repo).
  rpc GetMirror(GetMirrorRequest) returns (GetMirrorResponse);
  rpc SetMirror(SetMirrorRequest) returns (SetMirrorResponse);
  rpc DeleteMirror(DeleteMirrorRequest) returns (DeleteMirrorResponse);
  rpc SyncMirror(SyncMirrorRequest) returns (SyncMirrorResponse);
}

// OpsService covers the dev/deploy surface (services, sandboxes, builds).
service OpsService {
  rpc OpsStatus(OpsStatusRequest) returns (OpsStatusResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc GetService(GetServiceRequest) returns (GetServiceResponse);
  rpc LaunchService(LaunchServiceRequest) returns (LaunchServiceResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc ScaleService(ScaleServiceRequest) returns (ScaleServiceResponse);
  rpc SandboxExec(SandboxExecRequest) returns (SandboxExecResponse);
  rpc SandboxRead(SandboxReadRequest) returns (SandboxReadResponse);
  rpc SandboxWrite(SandboxWriteRequest) returns (SandboxWriteResponse);
  rpc SandboxJobKill(SandboxJobKillRequest) returns (SandboxJobKillResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc Build(BuildRequest) returns (BuildResponse);
  rpc TaskLog(TaskLogRequest) returns (stream TaskLogResponse);
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message TaskLogResponse {
  string stream = 1; // stdout | stderr | state
  string line = 2;
}

// RegistryService covers the package registry surface.
service RegistryService {
  rpc ListPackageTypes(ListPackageTypesRequest) returns (ListPackageTypesResponse);
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  rpc PackageVersions(PackageVersionsRequest) returns (PackageVersionsResponse);
  rpc DeletePackage(DeletePackageRequest) returns (DeletePackageResponse);
  rpc DeletePackageVersion(DeletePackageVersionRequest) returns (DeletePackageVersionResponse);
  rpc ListPublishSpecs(ListPublishSpecsRequest) returns (ListPublishSpecsResponse);
  rpc OCICatalog(OCICatalogRequest) returns (OCICatalogResponse);
}

// ---------- Lab additions ----------

message DeleteOrgRequest { string org = 1; }
message DeleteOrgResponse { bool ok = 1; string error = 2; }

message ReleaseView {
  string tag = 1;
  string name = 2;
  string description = 3;
  bool draft = 4;
  bool prerelease = 5;
  string revision_id = 6;
  string created = 7;
  repeated ReleaseAssetView assets = 8;
}

message ReleaseAssetView {
  string name = 1;
  int64 size = 2;
  string digest = 3;
  string content_type = 4;
}

message ListReleasesRequest { string org = 1; string repo = 2; }
message ListReleasesResponse { repeated ReleaseView releases = 1; }

message DownloadReleaseAssetRequest { string org = 1; string repo = 2; string tag = 3; string name = 4; }
message DownloadReleaseAssetResponse { bytes data = 1; string name = 2; string content_type = 3; }

message ArchiveRequest { string org = 1; string repo = 2; string ref = 3; }
message ArchiveResponse { bytes data = 1; string filename = 2; }

message MirrorCfg {
  string pull_url = 1;
  string push_url = 2;
  bool push_secret_set = 3;
}

message GetMirrorRequest { string org = 1; string repo = 2; }
message GetMirrorResponse { MirrorCfg mirror = 1; }

message SetMirrorRequest {
  string org = 1;
  string repo = 2;
  string pull_url = 3;
  string push_url = 4;
  string push_secret = 5;
}
message SetMirrorResponse { bool ok = 1; string error = 2; }

message DeleteMirrorRequest { string org = 1; string repo = 2; }
message DeleteMirrorResponse { bool ok = 1; string error = 2; }

message SyncMirrorRequest {
  string org = 1;
  string repo = 2;
  string kind = 3; // pull | push
  map<string, string> body = 4;
}
message SyncMirrorResponse { bool ok = 1; string updated_branches = 2; string error = 3; }

// ---------- Registry additions ----------

message OCICatalogRequest {}
message OCICatalogResponse { repeated string repositories = 1; }


// ---------- SandboxService: worker-backed sandboxes (frontend single entry) ----------
//
// easylab proxies the easyworker Connect API (worker.v1) inside every sandbox
// container: jobs observability (list/paginate/watch-stream), console
// (execute/stdin/kill), file browsing, and lifecycle — launching arbitrary
// base images (any distro / toolchain image) with the easyworker binary
// injected as ENTRYPOINT via a cached derived image (podman local build).
// Worker messages are reused as-is (single source of truth in
// worker/v1/worker.proto) wrapped with a `sandbox` routing field.

message SandboxInfo {
  string name = 1;          // container/service name (session key or standalone)
  string org = 2;           // association: '' org = standalone sandbox (no sync)
  string repo = 3;
  string branch = 4;
  string base_image = 5;    // e.g. docker.io/library/golang:1.26
  string derived_image = 6; // injected-worker image tag
  string workspace = 7;     // default /workspace ('/tmp' for nonroot bases)
  string phase = 8;         // live podman phase (Running/Pending/Exited/gone)
  string pod_ip = 9;
  string boot_id = 10;      // live worker boot id (changed = worker restarted)
  int32 running_jobs = 11;
  int32 total_jobs = 12;    // worker window (24h retention)
  string synced_rev = 13;   // easylab rev-coherence metadata
  string synced_boot_id = 14;
  string error = 15;        // aggregation note (worker unreachable etc.)
}

message ListSandboxesRequest {}
message ListSandboxesResponse { repeated SandboxInfo sandboxes = 1; }

message GetSandboxRequest { string name = 1; }
message GetSandboxResponse { SandboxInfo sandbox = 1; }

message EnsureSandboxImageRequest { string base_image = 1; }
message EnsureSandboxImageResponse {
  string derived_image = 1;
  bool built = 2; // false = cache hit
}

message LaunchSandboxRequest {
  string name = 1;
  string base_image = 2;
  string org = 3;  // '' = standalone (independent sandbox, never synced)
  string repo = 4;
  string branch = 5;
  string workspace = 6; // default /workspace
  map<string, string> env = 7;
  string cpus = 8;
  uint64 memory_bytes = 9;
}
message LaunchSandboxResponse { SandboxInfo sandbox = 1; }

message DeleteSandboxRequest { string name = 1; }
message DeleteSandboxResponse { bool ok = 1; string error = 2; }

message ExecuteRequest { string sandbox = 1; worker.v1.ExecuteRequest req = 2; }
message ListJobsRequest {
  string sandbox = 1;
  int32 limit = 2;
}
message JobOutputRequest { string sandbox = 1; worker.v1.JobOutputRequest req = 2; }
message WatchJobRequest { string sandbox = 1; worker.v1.WatchJobRequest req = 2; }
message JobWaitRequest { string sandbox = 1; worker.v1.JobWaitRequest req = 2; }
message JobStdinRequest { string sandbox = 1; worker.v1.JobStdinRequest req = 2; }
message JobKillRequest { string sandbox = 1; worker.v1.JobKillRequest req = 2; }
message FileReadRequest { string sandbox = 1; worker.v1.FileReadRequest req = 2; }

message SyncWorkspaceRequest {
  string sandbox = 1;
  string org = 2;
  string repo = 3;
  string rev = 4;   // branch head commit to push
  string branch = 5;
}
message SyncWorkspaceResponse { string synced_rev = 1; }
message FileWriteRequest { string sandbox = 1; worker.v1.FileWriteRequest req = 2; }
message FileListRequest { string sandbox = 1; worker.v1.FileListRequest req = 2; }

// SandboxService fronts every worker.v1 API for the UI/console and owns the
// sandbox lifecycle (derived image + launch + sync + registry table).
service SandboxService {
  // lifecycle
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc EnsureSandboxImage(EnsureSandboxImageRequest) returns (EnsureSandboxImageResponse);
  rpc LaunchSandbox(LaunchSandboxRequest) returns (LaunchSandboxResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
  // worker passthroughs (sandbox routing + worker.v1 payloads)
  rpc Execute(ExecuteRequest) returns (worker.v1.ExecuteResponse);
  rpc ListJobs(ListJobsRequest) returns (worker.v1.ListJobsResponse);
  rpc JobOutput(JobOutputRequest) returns (worker.v1.JobOutputResponse);
  rpc WatchJob(WatchJobRequest) returns (stream worker.v1.WatchJobResponse);
  rpc JobWait(JobWaitRequest) returns (worker.v1.JobWaitResponse);
  rpc JobStdin(JobStdinRequest) returns (worker.v1.JobStdinResponse);
  rpc JobKill(JobKillRequest) returns (worker.v1.JobKillResponse);
  rpc FileRead(FileReadRequest) returns (worker.v1.FileReadResponse);
  // SyncWorkspace pushes the repo tree at rev into the sandbox and records
  // rev + worker boot id in the registry (single rev-coherence write).
  rpc SyncWorkspace(SyncWorkspaceRequest) returns (SyncWorkspaceResponse);
  rpc FileWrite(FileWriteRequest) returns (worker.v1.FileWriteResponse);
  rpc FileList(FileListRequest) returns (worker.v1.FileListResponse);
}



// ---------- CI / Workflow (event-driven automation) ----------
//
// A Workflow is a declarative, event-driven unit (on -> jobs). A Run is one
// instantiation of a Workflow on a trigger. A single-job workflow (no needs,
// manual trigger) is the CI "run once" special case — no separate StartJob.
// Jobs carry runs-on (runner labels incl. toolchain), optional container
// override, steps, and a produce action (oci-build | artifact-upload |
// publish-protocol). No kind: outcome is decided by produce + labels.

message Runner {
  string id = 1;
  repeated string labels = 2;   // os=linux|windows|macos, arch=, is_container=, toolchain=
  string backend = 3;           // podman | host
  string addr = 4;              // host runner dial address
  int64  last_seen = 5;         // heartbeat unix millis
  bool   session_bound = 6;     // true = sandbox worker (not in CI pool)
}

message Trigger { repeated string events = 1; } // push | manual

message Step {
  string name = 1;
  string run = 2;
  map<string, string> env = 3;
  string working_directory = 4;
}

message Produce {
  string action = 1;      // oci-build | artifact-upload | publish-protocol
  string context = 2;     // oci-build: build context (default workspace root)
  string dockerfile = 3;  // oci-build: Dockerfile path (default root/Dockerfile)
  string tag = 4;         // oci-build: image tag
  string path = 5;        // artifact-upload: glob path(s) relative to workspace
  string destination = 6; // artifact-upload: workspace | release | registry
  string ref = 7;         // artifact-upload: release tag/ref
  string protocol = 8;    // publish-protocol: npm/pypi/cargo/...
  string name = 9;
  string version = 10;
  string file = 11;
}

message JobDef {
  string id = 1;
  repeated string needs = 2;        // prerequisite job ids (DAG order)
  repeated string runs_on = 3;      // runner labels (os/arch/is_container/toolchain)
  string container = 4;             // explicit image override
  string working_directory = 5;
  repeated Step steps = 6;
  Produce produce = 7;
}

message Workflow {
  string id = 1;
  string name = 2;
  string org = 3;
  string repo = 4;
  string branch = 5;
  Trigger on = 6;
  repeated JobDef jobs = 7;
}

message JobInstance {
  string id = 1;
  string def_id = 2;
  string status = 3;      // pending | running | success | failure | cancelled
  string result = 4;
}

message Run {
  string id = 1;
  string workflow_id = 2;
  string status = 3;      // pending | running | success | failure
  repeated JobInstance jobs = 4;
  string started_at = 5;
  string finished_at = 6;
}

message GetWorkflowRequest { string id = 1; }
message GetWorkflowResponse { Workflow workflow = 1; }
message CreateWorkflowRequest { Workflow workflow = 1; }
message CreateWorkflowResponse { Workflow workflow = 1; }
message ListWorkflowsRequest { string org = 1; string repo = 2; }
message ListWorkflowsResponse { repeated Workflow workflows = 1; }
message TriggerRunRequest { string workflow_id = 1; }
message TriggerRunResponse { Run run = 1; }
message GetRunRequest { string id = 1; }
message GetRunResponse { Run run = 1; }
message ListRunsRequest { string workflow_id = 1; }
message ListRunsResponse { repeated Run runs = 1; }
message RunJobLogRequest { string run_id = 1; string job_id = 2; }
message RunJobLogResponse { string stream = 1; string line = 2; }
message CancelRunRequest { string id = 1; }
message CancelRunResponse { bool ok = 1; }
message RegisterRunnerRequest { Runner runner = 1; }
message RegisterRunnerResponse { bool ok = 1; }
message ListRunnersRequest { bool session_bound = 1; }
message ListRunnersResponse { repeated Runner runners = 1; }

service WorkflowService {
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc RunJobLog(RunJobLogRequest) returns (stream RunJobLogResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
}
