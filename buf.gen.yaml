version: v2
plugins:
  # TypeScript (single set: BOTH easylab + agent)
  - remote: buf.build/bufbuild/es
    out: gen/es
    opt: target=ts
  - remote: buf.build/connectrpc/es
    out: gen/es
    opt: target=ts
  # Dart (single set: BOTH easylab + agent)
  - remote: buf.build/protocolbuffers/dart
    out: gen/dart
  - remote: buf.build/connectrpc/dart
    out: gen/dart
  # Kotlin (connect-kotlin: https://buf.build/connectrpc/kotlin)
  - remote: buf.build/connectrpc/kotlin
    out: /tmp/gen-kotlin
  # Swift (connect-swift: https://buf.build/connectrpc/swift)
  - remote: buf.build/connectrpc/swift
    out: /tmp/gen-swift
